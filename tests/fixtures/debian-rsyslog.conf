# Debian/Ubuntu rsyslog.conf (stock, from rsyslog-pkg-ubuntu bionic).
# Include path made CWD-relative for repo testing; real host path is
# /etc/rsyslog.d/*.conf. Verbatim stock copy for reference:
# tests/fixtures/stock-debian-rsyslog.conf
$ModLoad imuxsock
$ModLoad imklog
#$ModLoad immark

#$ModLoad imudp
#$UDPServerRun 514

#$ModLoad imtcp
#$InputTCPServerRun 514

$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat

$RepeatedMsgReduction on

$FileOwner syslog
$FileGroup adm
$FileCreateMode 0640
$DirCreateMode 0755
$Umask 0022
$PrivDropToUser syslog
$PrivDropToGroup syslog

$WorkDirectory /var/spool/rsyslog

$IncludeConfig rsyslog.d/*.conf
