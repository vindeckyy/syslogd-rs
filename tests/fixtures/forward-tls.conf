# TCP + TLS ingress and egress sample
$ModLoad imtcp
module(load="imtcp" StreamDriver.Name="gtls" StreamDriver.Mode="1" StreamDriver.AuthMode="x509/name" PermittedPeer="collector.example.com")
input(type="imtcp" port="6514" address="127.0.0.1" StreamDriver.Mode="1" StreamDriver.AuthMode="x509/name" PermittedPeer="collector.example.com")

$DefaultNetstreamDriverCAFile /etc/ssl/certs/ca.pem
$DefaultNetstreamDriverCertFile /etc/ssl/certs/syslogd.pem
$DefaultNetstreamDriverKeyFile /etc/ssl/private/syslogd.key

*.* /var/log/messages
*.emerg :omusrmsg:*
