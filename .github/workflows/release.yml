name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            runner: ubuntu-latest
          - os: macos-latest
            arch: aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: syslogd-rs-${{ matrix.os }}-${{ matrix.arch }}
          path: target/release/syslogd-rs
      - uses: actions/upload-artifact@v4
        with:
          name: syslogng2rsyslog-${{ matrix.os }}-${{ matrix.arch }}
          path: target/release/syslogng2rsyslog

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: false
