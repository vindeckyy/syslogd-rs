name: Bug Report
description: A problem with syslogd-rs configuration parsing, routing, or transport
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Short, concrete description of the behavior you observed.
      placeholder: >
        e.g. Strict check accepts a config whose forward action uses
        an undefined template
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal config
      description: >
        The smallest rsyslog.conf (or syslog-ng source) that reproduces
        the issue. Paste the daemon's --dump-merged output instead when
        includes are involved.
      placeholder: |
        module(load="imudp")
        input(type="imudp" port="51514")
        *.* /var/log/messages
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      validations:
        required: true
  - type: input
    id: version
    attributes:
      label: syslogd-rs version
      placeholder: e.g. 0.1.0 (output of syslogd-rs -v)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Debian 12, RHEL 9
      validations:
        required: true
